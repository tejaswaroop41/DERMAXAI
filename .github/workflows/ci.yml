name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — install, test, syntax check, smoke test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU-only torch first
        working-directory: backend
        run: |
          grep -E "^torch(vision)?==" requirements.txt | \
            xargs pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining backend dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install test-only dependencies
        run: pip install --no-cache-dir httpx pytest

      - name: Syntax check every backend file
        working-directory: backend
        run: |
          python -m py_compile app.py
          find core ai reports tests -name "*.py" -exec python -m py_compile {} +

      - name: Run backend regression tests
        working-directory: backend
        run: pytest -q tests/test_uncertainty.py

      - name: Run smoke test (auth -> diagnose -> doctor review)
        working-directory: backend
        run: python tests/smoke_test.py

  frontend:
    name: Frontend — install, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend contract tests
        working-directory: frontend
        run: node --test tests/ui_contract.test.mjs

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

  docker:
    name: Docker — build and integration check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Build both images
        run: docker compose build

      - name: Start integrated stack
        env:
          SECRET_KEY: ci-compose-secret
          DEBUG: "true"
          ALLOW_RANDOM_WEIGHTS: "true"
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/health > /tmp/backend-health.json; then
              cat /tmp/backend-health.json
              exit 0
            fi
            sleep 4
          done
          docker compose ps
          docker compose logs --no-color backend
          exit 1

      - name: Verify frontend health and API proxy
        run: |
          curl --fail --silent http://localhost:5173/healthz
          curl --fail --silent http://localhost:5173/api/health

      - name: Stop integrated stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret not set -- skipping deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --service backend
