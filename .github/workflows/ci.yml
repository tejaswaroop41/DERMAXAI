name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — install, test, syntax check, smoke test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql://dermaxai:dermaxai@localhost:5432/dermaxai_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dermaxai
          POSTGRES_PASSWORD: dermaxai
          POSTGRES_DB: dermaxai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dermaxai -d dermaxai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install test-only dependencies
        run: python -m pip install --no-cache-dir pytest

      - name: Syntax check every backend file
        working-directory: backend
        run: |
          python -m py_compile app.py
          find core ai reports tests scripts -name "*.py" -exec python -m py_compile {} +

      - name: Run Alembic migration against PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify PostgreSQL migration schema
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          url = os.environ["DATABASE_URL"]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              identity = conn.execute(
                  text("SELECT current_database(), current_schema()")
              ).one()
              print(f"Database identity: database={identity[0]!r}, schema={identity[1]!r}")

              tables = set(inspect(conn).get_table_names())
              print(f"PostgreSQL tables after Alembic: {sorted(tables)}")

              revision = conn.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalars().all() if "alembic_version" in tables else []
              print(f"Alembic revision(s): {revision}")

              required = {
                  "users",
                  "patients",
                  "diagnoses",
                  "doctor_reviews",
                  "alembic_version",
              }
              missing = required - tables
              if missing:
                  raise AssertionError(
                      f"Alembic reported success but required tables are missing: {sorted(missing)}"
                  )
          engine.dispose()
          PY

      - name: Run PostgreSQL regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_postgres_regression.py

      - name: Run backend regression tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/dermaxai_ci.db
        run: python -m pytest -q tests

      - name: Run smoke test (auth -> diagnose -> doctor review)
        working-directory: backend
        env:
          ALLOW_RANDOM_WEIGHTS: "true"
        run: python tests/smoke_test.py

  frontend:
    name: Frontend — install, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend contract tests
        working-directory: frontend
        run: node --test tests/ui_contract.test.mjs

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

  docker:
    name: Docker — build and integration check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Build both images
        run: docker compose build

      - name: Start integrated stack
        env:
          SECRET_KEY: ci-compose-secret
          DEBUG: "true"
          ALLOW_RANDOM_WEIGHTS: "true"
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/health > /tmp/backend-health.json; then
              cat /tmp/backend-health.json
              exit 0
            fi
            sleep 4
          done
          docker compose ps
          docker compose logs --no-color backend
          exit 1

      - name: Verify frontend health and API proxy
        run: |
          set -eu
          echo "Checking frontend health endpoint..."
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://localhost:5173/healthz
          echo
          echo "Checking frontend -> backend API proxy..."
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 http://localhost:5173/api/health; then
            echo "Frontend proxy check failed. Collecting container diagnostics..."
            docker compose ps
            echo "--- frontend logs ---"
            docker compose logs --no-color frontend
            echo "--- rendered nginx configuration ---"
            docker compose exec -T frontend nginx -T || true
            echo "--- backend logs ---"
            docker compose logs --no-color backend
            exit 1
          fi
          echo

      - name: Stop integrated stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret not set -- skipping deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --service backend
