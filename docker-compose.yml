services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dermaxai-change-in-production}
      DEBUG: ${DEBUG:-false}
      MODEL_PATH: ${MODEL_PATH:-/data/models/best.pth}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/dermaxai.db}
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      HEATMAPS_DIR: ${HEATMAPS_DIR:-/data/heatmaps}
      REPORTS_DIR: ${REPORTS_DIR:-/data/generated_reports}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
    volumes:
      - backend_data:/data
      - ./backend/models:/data/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
