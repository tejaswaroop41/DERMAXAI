version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - heatmaps_data:/app/heatmaps
      - reports_data:/app/generated_reports
    environment:
      - SECRET_KEY=${SECRET_KEY:-dermaxai-change-in-production}
      - MODEL_PATH=/app/models/best.pth
      - DATABASE_URL=sqlite:///./dermaxai.db
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
  heatmaps_data:
  reports_data:
